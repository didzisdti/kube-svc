apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: kube-svc-platform
  namespace: argocd

spec:
  generators:
    - list:
        elements:
          - name: prometheus

  template:
    metadata:
      name: prometheus
    spec:
      project: default

      sources:
        # Helm chart from external repo
        - repoURL: https://prometheus-community.github.io/helm-charts
          chart: kube-prometheus-stack
          targetRevision: 80.13.0
          helm:
            valueFiles:
              - $values/kube-apps/prometheus/values.yaml

        # Git repo for values
        - repoURL: https://github.com/didzisdti/kube-svc
          targetRevision: HEAD
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - Replace=true