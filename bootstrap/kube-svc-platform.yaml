apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: kube-svc-platform
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/didzisdti/kube-svc.git
        revision: HEAD
        directories:
          - path: kube-apps-values/*/*

  template:
    metadata:
      name: '{{path.basename}}-{{path.basename(1)}}'  # appname-groupname

    spec:
      project: svc-platform

      source:
        - repoURL: '{{values.repoURL}}'
          chart: '{{values.chart}}'
          targetRevision: '{{values.version}}'
          helm:
            valueFiles:
              - '$values/kube-apps-values/{{path.basename(1)}}/{{path.basename}}/values.yaml'
        - repoURL: https://github.com/didzisdti/kube-svc.git
          targetRevision: HEAD
          ref: values

      
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename(1)}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true