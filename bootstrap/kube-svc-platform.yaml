apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kube-svc-platform
  namespace: argocd

spec:
  generators:
    - git:
        repoURL: https://github.com/didzisdti/kube-svc.git
        revision: HEAD
        directories:
          - path: kube-apps-values/*/*

  template:
    metadata:
      # appname-groupname
      name: '{{path.basename}}-{{path.splitList "/" | index 1}}'

    spec:
      project: svc-platform

      # Single source per app (Helm chart)
      source:
        repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 80.13.0
        helm:
          # Values file path relative to repo root
          valueFiles:
            - 'kube-apps-values/{{path.splitList "/" | index 1}}/{{path.basename}}/values.yaml'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.splitList "/" | index 1}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
