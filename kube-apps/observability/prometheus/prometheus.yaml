apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd

spec:
  project:
    name: svc-platform

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 80.13.0
      helm:
        valueFiles:
          - $values/kube-apps-values/prometheus/prometheus-values.yaml      

    - repoURL: https://github.com/didzisdti/kube-svc/
      targetRevision: HEAD
      ref: values
      path: .
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring 
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true