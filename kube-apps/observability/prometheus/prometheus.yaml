apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd

spec:
  project: svc-platform

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 80.13.0
      helm:
        valueFiles:
          - '$values/kube-apps-values/observability/prometheus/values.yaml'  

    - repoURL: https://github.com/didzisdti/kube-svc.git
      targetRevision: HEAD
      ref: values
      
  destination:
    server: https://kubernetes.default.svc
    namespace: observability 
    
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true